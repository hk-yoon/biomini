name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install BioMini and test dependencies
        run: python -m pip install -e ".[dev,validation]"

      - name: Run tests
        run: python -m pytest

      - name: Run coverage
        if: matrix.python-version == '3.13'
        run: python -m pytest --cov=biomini --cov-report=term-missing
